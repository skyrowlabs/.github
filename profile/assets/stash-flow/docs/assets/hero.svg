<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="stash.flow — chosen streams flowing past a gate into a layered stash jar, one unchosen stream stopped at the gate, beside the wordmark">
  <title>stash.flow — you decide what you track, and you own the signal</title>
  <defs>
    <clipPath id="hero-clip"><rect width="1000" height="300" rx="18"/></clipPath>
    <radialGradient id="glow-a" cx="0.16" cy="0.45" r="0.55"><stop offset="0" stop-color="#fb923c" stop-opacity="0.20"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-b" cx="0.88" cy="0.85" r="0.5"><stop offset="0" stop-color="#fb923c" stop-opacity="0.12"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e8edf4" fill-opacity="0.07"/></pattern>
    <clipPath id="jar-in"><rect x="154" y="146" width="84" height="108" rx="10"/></clipPath>
    <filter id="sf-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="s1" d="M 26,58 C 96,58 120,60 150,82 C 168,98 182,116 184,156"/>
    <path id="s2" d="M 26,100 C 92,100 128,104 158,116 C 178,124 192,134 196,156"/>
    <path id="s3" d="M 26,142 C 80,142 110,138 138,130 C 166,122 200,124 208,156"/>
  </defs>
  <g clip-path="url(#hero-clip)">
    <rect width="1000" height="300" fill="#05090e"/>
    <rect width="1000" height="300" fill="url(#glow-a)"/>
    <rect width="1000" height="300" fill="url(#glow-b)"/>
    <rect width="1000" height="300" fill="url(#dots)"/>

    <!-- streams: three chosen, one stopped at the gate -->
    <g fill="none" stroke-linecap="round">
      <use href="#s1" stroke="#fb923c" stroke-opacity="0.85" stroke-width="3"/>
      <use href="#s2" stroke="#fb923c" stroke-opacity="0.65" stroke-width="3"/>
      <use href="#s3" stroke="#fb923c" stroke-opacity="0.45" stroke-width="3"/>
      <path d="M 26,190 C 60,190 80,190 100,190" stroke="#344050" stroke-width="3" stroke-dasharray="2 7"/>
    </g>

    <!-- the gate: you decide what passes -->
    <g>
      <rect x="106" y="40" width="4" height="168" rx="2" fill="#1c2633"/>
      <g fill="#fb923c"><rect x="104" y="53" width="8" height="10" rx="2"/><rect x="104" y="95" width="8" height="10" rx="2"/><rect x="104" y="132" width="8" height="10" rx="2"/></g>
      <rect x="103" y="182" width="10" height="16" rx="2" fill="#344050"/>
      <path d="M 88,180 l 8,8 m 0,-8 l -8,8" stroke="#7a8fa8" stroke-width="2" stroke-linecap="round" transform="translate(-4,-12)"/>
    </g>

    <!-- particles moving along the chosen streams -->
    <g fill="#fdba74" filter="url(#sf-glow)">
      <circle r="3"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#s1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="4.2s" begin="-1.4s" repeatCount="indefinite"><mpath href="#s2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="4.2s" begin="-1.4s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="3.9s" begin="-2.6s" repeatCount="indefinite"><mpath href="#s3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3.9s" begin="-2.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- the stash: a jar with layered contents -->
    <g>
      <rect x="152" y="144" width="88" height="112" rx="12" fill="#0b1016" stroke="#7a8fa8" stroke-opacity="0.7" stroke-width="2"/>
      <rect x="146" y="140" width="100" height="6" rx="3" fill="#1c2633" stroke="#7a8fa8" stroke-opacity="0.7"/>
      <g clip-path="url(#jar-in)">
        <rect x="154" y="232" width="84" height="24" fill="#fb923c" fill-opacity="0.85"/>
        <rect x="154" y="212" width="84" height="20" fill="#fb923c" fill-opacity="0.55"/>
        <rect x="154" y="194" width="84" height="18" fill="#fb923c" fill-opacity="0.32">
          <animate attributeName="y" values="194;191;194" dur="5s" repeatCount="indefinite"/>
        </rect>
        <rect x="154" y="194" width="84" height="2" fill="#fdba74" fill-opacity="0.8">
          <animate attributeName="y" values="194;191;194" dur="5s" repeatCount="indefinite"/>
        </rect>
      </g>
      <rect x="162" y="154" width="6" height="30" rx="3" fill="#e8edf4" fill-opacity="0.10"/>
    </g>

    <text x="284" y="84" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.8" fill="#fb923c">SKYROW.LABS · PERSONAL INTELLIGENCE PLATFORM</text>
    <text x="280" y="172" font-family="'Space Grotesk', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-1.8" fill="#e8edf4">stash.flow</text>
    <text font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#b6c2d1">
      <tspan x="284" y="214">You decide what you track, and you own the signal.</tspan>
      <tspan x="284" y="242">Collection runs local-first on your machine. Rebuilding as v2.</tspan>
    </text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#1c2633"/>
</svg>
